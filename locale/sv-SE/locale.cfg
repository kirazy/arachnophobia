[mod-name]
arachnophobia=Arachnophobia

[mod-description]
arachnophobia=Ger inställningar som gör Spidertron spelbar även för spelare med spindelfobi. Som standard döljs Spidertrons ben och laserpekare visas vid fötterna. Innehåller nya alternativ för att anpassa ögonens färg, antalet ögon och lampor samt antalet ben. Spelare kan därmed ta bort upp till sex ben som ett alternativ till att göra dem osynliga.

[mod-setting-name]
arachnophobia-number-of-legs=Antal ben

arachnophobia-leg-visibility=Benens visningsstil
arachnophobia-display-dust-particles=Visa dammpartiklar
arachnophobia-mute-legs=Stäng av benens ljud
arachnophobia-mute-feet=Stäng av fötternas ljud

arachnophobia-eyes-color=Ögonfärg
arachnophobia-eyes-primary=Tänd primära ögon
arachnophobia-eyes-secondary=Tänd sekundära ögon
arachnophobia-eyes-tertiary=Tänd tertiära ögon
arachnophobia-eyes-back=Lys upp skalets ögon

arachnophobia-replace-icons=Ersätt ikoner

[mod-setting-description]
arachnophobia-number-of-legs=Ställer in antalet ben på Spidertron till mellan 2 och 8.\n\n[color=#9cdcfe]Standard: 8[/color]

arachnophobia-leg-visibility=Ställer in hur benen visas.\n\n[font=default-semibold]Dolda[/font] döljer benen och gör Spidertron till en svävande farkost.\n[font=default-semibold]Laserpekare[/font] döljer benen och visar en laserpekare där varje fot befinner sig.\n[font=default-semibold]Synliga[/font] behåller benens utseende när du ändrar antalet ben.\n\n[color=#9cdcfe]Standard: Laserpekare[/color]
arachnophobia-display-dust-particles=Spidertron skapar dammpartiklar där de osynliga fötterna rör marken.\n\n[color=#9cdcfe]Standard[/color]: [color=red]Inaktiverat[/color]
arachnophobia-mute-legs=Stänger av ljudet från benens rörelser.\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktiverat[/color]
arachnophobia-mute-feet=Stänger av fotstegsljudet när Spidertron går.\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktiverat[/color]

arachnophobia-eyes-color=Ställer in ögonens färg.\n\n[color=#9cdcfe]Standard[/color]: [color=#ff0800]Röd[/color]
arachnophobia-eyes-primary=Tänder följande lampor:\n[img=arachnophobia-light-guide-primary-1][img=arachnophobia-light-guide-primary-2][img=arachnophobia-light-guide-primary-3]\n[img=arachnophobia-light-guide-primary-4][img=arachnophobia-light-guide-primary-5][img=arachnophobia-light-guide-primary-6]\n[img=arachnophobia-light-guide-primary-7][img=arachnophobia-light-guide-primary-8][img=arachnophobia-light-guide-primary-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktiverat[/color]
arachnophobia-eyes-secondary=Tänder följande lampor:\n[img=arachnophobia-light-guide-secondary-1][img=arachnophobia-light-guide-secondary-2][img=arachnophobia-light-guide-secondary-3]\n[img=arachnophobia-light-guide-secondary-4][img=arachnophobia-light-guide-secondary-5][img=arachnophobia-light-guide-secondary-6]\n[img=arachnophobia-light-guide-secondary-7][img=arachnophobia-light-guide-secondary-8][img=arachnophobia-light-guide-secondary-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktiverat[/color]
arachnophobia-eyes-tertiary=Tänder följande lampor:\n[img=arachnophobia-light-guide-tertiary-1][img=arachnophobia-light-guide-tertiary-2][img=arachnophobia-light-guide-tertiary-3]\n[img=arachnophobia-light-guide-tertiary-4][img=arachnophobia-light-guide-tertiary-5][img=arachnophobia-light-guide-tertiary-6]\n[img=arachnophobia-light-guide-tertiary-7][img=arachnophobia-light-guide-tertiary-8][img=arachnophobia-light-guide-tertiary-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktiverat[/color]
arachnophobia-eyes-back=Tänder följande lampor:\n[img=arachnophobia-light-guide-back-1][img=arachnophobia-light-guide-back-2][img=arachnophobia-light-guide-back-3]\n[img=arachnophobia-light-guide-back-4][img=arachnophobia-light-guide-back-5][img=arachnophobia-light-guide-back-6]\n[img=arachnophobia-light-guide-back-7][img=arachnophobia-light-guide-back-8][img=arachnophobia-light-guide-back-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktiverat[/color]

arachnophobia-replace-icons=Använder en söt sten med rörliga plastögon som föremåls- och teknologiikon.\n\nDet här är ett tillfälligt alternativ tills hela uppsättningen teknologi- och föremålsikoner är klar.\n\n[color=#9cdcfe]Standard[/color]: [color=red]Inaktiverat[/color]

